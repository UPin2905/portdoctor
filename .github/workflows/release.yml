name: Release CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Test
        run: go test ./...

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          version="${GITHUB_REF_NAME}"
          build() {
            local goos="$1"
            local goarch="$2"
            local extension="${3:-}"
            local output="dist/portdoctor-${goos}-${goarch}${extension}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X github.com/UPin2905/portdoctor/pkg/cli.version=$version" -o "$output" ./cmd/portdoctor
          }
          build linux amd64
          build darwin amd64
          build darwin arm64
          build windows amd64 .exe
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
